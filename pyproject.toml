[project]
name = "ruff-tutor-mcp"
version = "0.2.0"
description = "MCP server for learning Python best practices through Ruff violations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "daiki.tsutsui", email = "tsutsumi.aie@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "ruff", "linter", "python", "education", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic >= 2.0.0",
  "loguru >= 0.7.0",
  "mcp >= 1.10.0",
  "ruff >= 0.9.0",
]

[project.scripts]
ruff-tutor-mcp = "ruff_tutor_mcp.server:main"

[dependency-groups]
dev = [
  "pytest >= 8.3",
  "pytest-cov >= 5.0",
  "pytest-mock >= 3.14",
  "mypy >= 1.7.1",
]

[tool.ruff]
target-version = "py311"
line-length = 119
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D213",
  "D400",
  "D415",
  "G004",
  "Q000",
  "Q003",
  "S101",
  "EM101",
  "EM102",
  "COM812",
  "FBT001",
  "FBT002",
  "RUF001",
  "RUF002",
  "RUF003",
  "TC001",
  "TRY003",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S108", "ARG005"]

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
allow_redefinition = false
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/ruff_tutor_mcp"]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/ruff_tutor_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
